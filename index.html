<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오목 게임</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f5f5;
}

h1{
    margin-top:20px;
}

#board{
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(15,40px);
    grid-template-rows:repeat(15,40px);
    width:600px;
    height:600px;
    background:#d8a45d;
    border:3px solid #333;
}

.cell{
    width:40px;
    height:40px;
    border:1px solid rgba(0,0,0,0.3);
    position:relative;
    box-sizing:border-box;
    cursor:pointer;
}

.cell::before{
    content:"";
    position:absolute;
    width:2px;
    height:40px;
    background:#333;
    left:50%;
    transform:translateX(-50%);
}

.cell::after{
    content:"";
    position:absolute;
    width:40px;
    height:2px;
    background:#333;
    top:50%;
    transform:translateY(-50%);
}

.stone{
    width:32px;
    height:32px;
    border-radius:50%;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:10;
}

.black{
    background:black;
}

.white{
    background:white;
    border:1px solid black;
}

button{
    padding:10px 20px;
    font-size:18px;
}

#status{
    font-size:22px;
    margin:15px;
}
</style>

</head>
<body>

<h1>오목 게임</h1>

<div id="status">현재 차례 : ● 흑</div>

<div id="board"></div>

<br>

<button onclick="resetGame()">새 게임</button>

<script>

const SIZE=15;

const board=[];
let current=1;
let gameOver=false;

const boardDiv=document.getElementById("board");
const status=document.getElementById("status");

function createBoard(){

    boardDiv.innerHTML="";
    board.length=0;

    for(let y=0;y<SIZE;y++){

        board[y]=[];

        for(let x=0;x<SIZE;x++){

            board[y][x]=0;

            const cell=document.createElement("div");
            cell.className="cell";

            cell.dataset.x=x;
            cell.dataset.y=y;

            cell.onclick=clickCell;

            boardDiv.appendChild(cell);

        }

    }

}

function clickCell(){

    if(gameOver)return;

    const x=parseInt(this.dataset.x);
    const y=parseInt(this.dataset.y);

    if(board[y][x]!=0)return;

    board[y][x]=current;

    const stone=document.createElement("div");

    stone.className="stone "+(current==1?"black":"white");

    this.appendChild(stone);

    if(checkWin(x,y,current)){

        status.innerHTML=(current==1?"● 흑":"○ 백")+" 승리!";
        gameOver=true;
        return;

    }

    current=current==1?2:1;

    status.innerHTML="현재 차례 : "+(current==1?"● 흑":"○ 백");

}

function count(x,y,dx,dy,color){

    let c=0;

    let nx=x+dx;
    let ny=y+dy;

    while(
        nx>=0&&nx<SIZE&&
        ny>=0&&ny<SIZE&&
        board[ny][nx]==color
    ){

        c++;
        nx+=dx;
        ny+=dy;

    }

    return c;

}

function checkWin(x,y,color){

    const dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(let d of dirs){

        const total=
            1+
            count(x,y,d[0],d[1],color)+
            count(x,y,-d[0],-d[1],color);

        if(total>=5)return true;

    }

    return false;

}

function resetGame(){

    current=1;
    gameOver=false;
    status.innerHTML="현재 차례 : ● 흑";
    createBoard();

}

createBoard();

</script>

</body>
</html>
